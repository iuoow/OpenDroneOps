name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go run ./cmd/capacitycheck
      - run: go build ./cmd/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.5.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-diagnostics
          path: web/test-results/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    env:
      POSTGRES_IMAGE: postgres:18.4
      REDIS_IMAGE: redis:7.2.14
      MOSQUITTO_IMAGE: eclipse-mosquitto:2.1.2-alpine
      POSTGRES_PASSWORD: integration-only
      POSTGRES_DSN: postgres://opendroneops:integration-only@localhost:5432/opendroneops?sslmode=disable
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: ""
      MQTT_URL: mqtt://localhost:1883
      INTEGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Start pinned infrastructure
        run: docker compose -f deployment/docker-compose.blueprint.yaml up -d --wait --wait-timeout 45
      - name: Apply migrations
        run: go run ./cmd/migrate
      - name: Run PostgreSQL, Redis, and MQTT E2E
        run: go test -tags=integration ./integration/...
      - name: Collect service logs
        if: always()
        run: docker compose -f deployment/docker-compose.blueprint.yaml logs --no-color
      - name: Stop infrastructure
        if: always()
        run: docker compose -f deployment/docker-compose.blueprint.yaml down -v

  delivery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release package integrity verifier
        run: pwsh -File scripts/test-release-package-verifier.ps1
      - name: Build deployable application images without publishing
        run: |
          docker build --target server --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} --build-arg BUILD_TIME=ci -t opendroneops/server:ci .
          docker build --target worker --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} --build-arg BUILD_TIME=ci -t opendroneops/worker:ci .
          docker build --target migrate --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} --build-arg BUILD_TIME=ci -t opendroneops/migrate:ci .
      - name: Validate production application Compose contract
        env:
          OPENDRONEOPS_SERVER_IMAGE: opendroneops/server:ci
          OPENDRONEOPS_WORKER_IMAGE: opendroneops/worker:ci
          OPENDRONEOPS_MIGRATE_IMAGE: opendroneops/migrate:ci
          RELEASE_ENV_FILE: ./release.env.example
        run: docker compose --env-file deployment/release.env.example -f deployment/docker-compose.release.yaml config --quiet
