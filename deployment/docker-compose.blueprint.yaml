# Task 0 baseline. Production must replace tags with verified image digests and
# replace deployment/mosquitto.conf with TLS, ACL and credential-file config.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?pin POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: opendroneops
      POSTGRES_USER: opendroneops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    # PostgreSQL 18 stores its cluster below this mount. Keep the legacy
    # postgres_data volume outside this Compose definition so an upgrade never
    # silently mounts or overwrites older-major-version data.
    volumes: [postgres18_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendroneops -d opendroneops"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: ${REDIS_IMAGE:?pin REDIS_IMAGE}
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mosquitto:
    image: ${MOSQUITTO_IMAGE:?pin MOSQUITTO_IMAGE}
    ports: ["1883:1883", "9001:9001"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
volumes:
  postgres18_data:
  mosquitto_data:
